[package]
name = "osm-reader"
version = "0.1.0"
edition = "2021"

[features]
serde = ["dep:serde"]

[dependencies]
anyhow = "1.0.0"
chrono = { version = "0.4", default-features = false }
osmpbf = "0.3.5"
roxmltree = { version = "0.20.0", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true }
